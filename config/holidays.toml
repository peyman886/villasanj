# Fixed solar-calendar official holidays of Iran: they fall on the same Jalali day every year.
# Lunar (Hijri) holidays move every year and are deliberately NOT listed: Villasanj knows them
# only where platform calendars flag them (catalog.calendar_observation.is_holiday), and a date
# that depends on an unobserved lunar holiday is shown with a caveat (discovery/domain/dates.py).
source = "Iran's official calendar: fixed solar-date public holidays (entered 2026-10-01)"

# Platforms whose calendar flag means a public holiday. shab's "is_peak" also marks high season and
# did not flag 22 Aban 1405 (2026-11-13), which jabama flags on all 2,986 listings, so it is not used.
observed_from = ["jabama"]

