# Villasanj local stack. `make up` starts the core services (db, migrate, api, web).
# Pipeline (worker, browser) and routing (osrm) profiles arrive with M2 and M8.
# Host ports are configurable (VILLASANJ_*_PORT) and default away from common dev ports.
name: villasanj

x-backend-env: &backend-env
  DATABASE__URL: postgresql+psycopg://villasanj:villasanj@db:5432/villasanj
  LOGGING__FORMAT: json

services:
  db:
    build: infra/docker/postgres
    image: villasanj-db:local
    command: ["postgres", "-c", "shared_buffers=384MB"]
    environment:
      POSTGRES_USER: villasanj
      POSTGRES_PASSWORD: villasanj # local development only; never exposed beyond 127.0.0.1
      POSTGRES_DB: villasanj
    ports:
      - "127.0.0.1:${VILLASANJ_DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U villasanj -d villasanj"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 1536m

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: villasanj-backend:local
    command: ["alembic", "upgrade", "head"]
    env_file:
      - path: .env
        required: false
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    mem_limit: 512m

  api:
    image: villasanj-backend:local
    env_file:
      - path: .env
        required: false
    environment: *backend-env
    ports:
      - "127.0.0.1:${VILLASANJ_API_PORT:-8800}:8000"
    volumes:
      - blobs:/data/blobs
    depends_on:
      migrate:
        condition: service_completed_successfully
    mem_limit: 512m

  web:
    build: frontend
    image: villasanj-web:local
    environment:
      API_URL: http://api:8000
    ports:
      - "127.0.0.1:${VILLASANJ_WEB_PORT:-3300}:3000"
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 512m

volumes:
  pgdata:
  blobs:
